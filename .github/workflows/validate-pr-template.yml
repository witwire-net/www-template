name: Validate PR Template

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  pull-requests: read

jobs:
  validate-pr-template:
    name: Validate PR Template
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          node <<'NODE'
          // PR本文だけを検証し、フォーク由来のコードを実行しないことで安全性を保つ。
          const body = process.env.PR_BODY ?? '';
          const errors = [];

          // 正規表現へ利用者入力を埋め込むため、見出しや項目名を安全にエスケープする。
          const escapeRegex = (value) => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

          // テンプレートの主要見出しが消されていないかを確認し、レビュー観点の欠落を防ぐ。
          const requiredHeadings = [
            '## 概要',
            '## 顧客価値',
            '## 変更内容',
            '## 変更運用',
            '## 関連Issue / OpenSpec',
            '## セキュリティ確認',
            '## 仕様・API契約',
            '## アーキテクチャ確認',
            '## UI / UX変更',
            '## DB / マイグレーション',
            '## テスト',
            '## レビュー観点',
            '## リリース影響',
          ];

          for (const heading of requiredHeadings) {
            if (!body.includes(heading)) {
              errors.push(`必須見出しがありません: ${heading}`);
            }
          }

          // `- 項目名: 値` の形式で、PR作成者が各欄を空欄にしていないかを確認する。
          const getFieldValue = (label) => {
            const pattern = new RegExp(`^-\\s*${escapeRegex(label)}\\s*:\\s*(.*)$`, 'm');
            const match = body.match(pattern);
            return match ? match[1].trim() : null;
          };

          const requiredFields = [
            '目的',
            '主な変更',
            '利用者',
            '改善される体験',
            '変更内容',
            'Operation Lane',
            'UX Mode',
            'Review Depth',
            'Issue',
            'OpenSpec Change',
            'Scenario IDs',
            'UI / UX変更',
            'UI / UX変更の説明',
            '影響範囲',
            'デスクトップ確認',
            'モバイル確認',
            'アクセシビリティ確認',
            'プロダクトデザイナー確認',
            'DB変更',
            'マイグレーション',
            'データ影響',
            '実行した確認',
            '未実行の確認と理由',
            '重点確認箇所',
            '環境変数',
            '設定変更',
            '運用影響',
          ];

          for (const label of requiredFields) {
            const value = getFieldValue(label);
            if (value === null) {
              errors.push(`必須項目がありません: ${label}`);
            } else if (value === '') {
              errors.push(`必須項目が空欄です: ${label}`);
            }
          }

          // チェックリストを未確認のまま残すと、セキュリティや仕様確認の抜け漏れにつながるため失敗させる。
          if (/-\s*\[\s\]/.test(body)) {
            errors.push('未チェックのチェックボックスがあります。該当しない項目も理由を書いたうえでチェックしてください。');
          }

          // 三つの変更運用軸を個別に検証し、運用区分からUX方針やレビュー深度が暗黙に決まることを防ぐ。
          const operationLaneValue = getFieldValue('Operation Lane');
          const uxModeValue = getFieldValue('UX Mode');
          const reviewDepthValue = getFieldValue('Review Depth');
          if (operationLaneValue !== null && !['DIRECT', 'BEHAVIOR', 'ARCHITECTURE'].includes(operationLaneValue)) {
            errors.push('`Operation Lane` は `DIRECT`、`BEHAVIOR`、`ARCHITECTURE` のいずれかだけを記入してください。');
          }
          if (uxModeValue !== null && !['NONE', 'CONTINUITY', 'SHAPE'].includes(uxModeValue)) {
            errors.push('`UX Mode` は `NONE`、`CONTINUITY`、`SHAPE` のいずれかだけを記入してください。');
          }
          if (reviewDepthValue !== null && !['STANDARD', 'DEEP'].includes(reviewDepthValue)) {
            errors.push('`Review Depth` は `STANDARD` または `DEEP` のどちらかだけを記入してください。');
          }

          // 理由付きの「なし」を含めて非該当値を判定し、OpenSpecが必要な運用区分との組み合わせを検証する。
          const isNoneValue = (value) => /^なし(?:$|[（(])/u.test(value.trim());
          const openSpecChangeValue = getFieldValue('OpenSpec Change');
          const scenarioIdsValue = getFieldValue('Scenario IDs');
          const requiresOpenSpec = operationLaneValue === 'BEHAVIOR' || operationLaneValue === 'ARCHITECTURE';
          if (requiresOpenSpec && openSpecChangeValue !== null && isNoneValue(openSpecChangeValue)) {
            errors.push('`BEHAVIOR` と `ARCHITECTURE` では `OpenSpec Change` に `なし` を使用できません。');
          }
          if (
            openSpecChangeValue !== null &&
            !isNoneValue(openSpecChangeValue) &&
            !/^[a-z0-9][a-z0-9-]*$/u.test(openSpecChangeValue)
          ) {
            errors.push('`OpenSpec Change` は小文字のChange識別子、または `DIRECT` の場合は理由付きの `なし` を記入してください。');
          }
          if (requiresOpenSpec && scenarioIdsValue !== null && isNoneValue(scenarioIdsValue)) {
            errors.push('`BEHAVIOR` と `ARCHITECTURE` では1件以上の `Scenario IDs` が必要です。');
          }

          // Scenario IDはコンマまたは空白区切りで受け付け、仕様検査と同じ安定識別子形式へ限定する。
          if (scenarioIdsValue !== null && !isNoneValue(scenarioIdsValue)) {
            const scenarioIds = scenarioIdsValue
              .replaceAll('`', '')
              .split(/[,、\s]+/u)
              .filter((value) => value !== '');
            const invalidScenarioIds = scenarioIds.filter(
              (value) => !/^[\dA-Z]+(?:-[\dA-Z]+)*-S\d{3,}$/u.test(value)
            );
            if (scenarioIds.length === 0 || invalidScenarioIds.length > 0) {
              errors.push('`Scenario IDs` は `USER-MGMT-S001` 形式で記入し、複数の場合はコンマまたは空白で区切ってください。');
            }
          }

          const uiChangeValue = getFieldValue('UI / UX変更');
          if (uiChangeValue !== null && uiChangeValue !== 'あり' && uiChangeValue !== 'なし') {
            errors.push('`UI / UX変更` は `あり` または `なし` のどちらかだけを記入してください。');
          }

          // GitHubの画像添付で一般的に生成されるMarkdown画像、HTML画像、user-attachments URLを受け付ける。
          const imagePattern = /!\[[^\]]*\]\([^)]*\)|<img\b[^>]*\bsrc=["'][^"']+["'][^>]*>|https:\/\/github\.com\/user-attachments\/assets\/[A-Za-z0-9-]+/i;

          // 指定見出しから次の見出しまでを取り出し、各スクリーンショット欄の画像有無を個別に判定する。
          const getSubsection = (heading) => {
            const startPattern = new RegExp(`^${escapeRegex(heading)}\\s*$`, 'm');
            const startMatch = body.match(startPattern);
            if (!startMatch || startMatch.index === undefined) {
              return null;
            }

            const contentStart = startMatch.index + startMatch[0].length;
            const rest = body.slice(contentStart);
            const nextHeadingIndex = rest.search(/\n#{2,4}\s/);
            return nextHeadingIndex === -1 ? rest : rest.slice(0, nextHeadingIndex);
          };

          if (uiChangeValue === 'あり') {
            // 実際のUI変更では、プロダクトデザイナーと実ブラウザによる両表示幅の確認を必須証跡とする。
            for (const label of ['デスクトップ確認', 'モバイル確認', 'アクセシビリティ確認', 'プロダクトデザイナー確認']) {
              const value = getFieldValue(label);
              if (value !== null && isNoneValue(value)) {
                errors.push(`UI / UX変更ありの場合は実施内容が必須です: ${label}`);
              }
            }
            for (const heading of ['#### Desktop Before', '#### Desktop After', '#### Mobile Before', '#### Mobile After']) {
              const subsection = getSubsection(heading);
              if (subsection === null) {
                errors.push(`UI / UX変更ありの場合に必須のスクリーンショット欄がありません: ${heading}`);
              } else if (!imagePattern.test(subsection)) {
                errors.push(`UI / UX変更ありの場合は画像添付が必須です: ${heading}`);
              }
            }
          }

          if (errors.length > 0) {
            console.error('PRテンプレート検証に失敗しました。');
            for (const error of errors) {
              console.error(`- ${error}`);
            }
            process.exit(1);
          }

          console.log('PRテンプレート検証に成功しました。');
          NODE
